<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Dark tech gradient background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a11" />
    </linearGradient>

    <!-- Glowing accent gradient -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Signal pulse line gradient -->
    <linearGradient id="signalGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="40%" stop-color="#10b981" stop-opacity="1" />
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="1" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2,2" />
    </pattern>

    <!-- Glowing dot pattern -->
    <pattern id="dotsPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" />
    </pattern>

    <!-- Drop shadows and glow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* CSS Animations for Dynamic Effects */
    @keyframes pulseLine {
      0% {
        stroke-dashoffset: 1000;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }

    @keyframes scanline {
      0% {
        transform: translateY(-100%);
      }
      100% {
        transform: translateY(360px);
      }
    }

    @keyframes rotateGear {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes rotateGearRev {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(-360deg);
      }
    }

    @keyframes waveFloat {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes beaconGlow {
      0%, 100% {
        opacity: 0.3;
        transform: scale(0.95);
      }
      50% {
        opacity: 0.9;
        transform: scale(1.05);
      }
    }

    @keyframes titleGradient {
      0% {
        stop-color: #3b82f6;
      }
      50% {
        stop-color: #8b5cf6;
      }
      100% {
        stop-color: #06b6d4;
      }
    }

    .telemetry-line {
      stroke-dasharray: 1000;
      animation: pulseLine 8s linear infinite;
    }

    .gear-spin {
      transform-origin: 150px 180px;
      animation: rotateGear 25s linear infinite;
    }

    .gear-spin-rev {
      transform-origin: 230px 110px;
      animation: rotateGearRev 18s linear infinite;
    }

    .gear-spin-small {
      transform-origin: 90px 110px;
      animation: rotateGearRev 15s linear infinite;
    }

    .pulse-node {
      animation: beaconGlow 3s ease-in-out infinite;
      transform-origin: center;
    }

    .floating-badge {
      animation: waveFloat 4s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGradient)" rx="16" />

  <!-- Overlay Patterns -->
  <rect width="1200" height="360" fill="url(#gridPattern)" rx="16" opacity="0.7" />
  <rect width="1200" height="360" fill="url(#dotsPattern)" rx="16" opacity="0.5" />

  <!-- Ambient Light Circles -->
  <circle cx="150" cy="180" r="180" fill="#3b82f6" opacity="0.08" filter="url(#glow)" />
  <circle cx="1050" cy="180" r="160" fill="#8b5cf6" opacity="0.08" filter="url(#glow)" />
  <circle cx="600" cy="90" r="140" fill="#10b981" opacity="0.05" filter="url(#glow)" />

  <!-- Animated Background Gears (Industrial / Maintenance Theme) -->
  <g stroke="#334155" stroke-width="1.5" fill="none" opacity="0.35">
    <!-- Big Gear -->
    <g class="gear-spin">
      <circle cx="150" cy="180" r="60" stroke-dasharray="8,6" stroke-width="8" />
      <circle cx="150" cy="180" r="45" />
      <circle cx="150" cy="180" r="20" />
      <path d="M 150 110 L 150 250 M 80 180 L 220 180 M 100 130 L 200 230 M 100 230 L 200 130" stroke-width="2" />
    </g>
    <!-- Medium Gear -->
    <g class="gear-spin-rev">
      <circle cx="230" cy="110" r="40" stroke-dasharray="6,5" stroke-width="6" />
      <circle cx="230" cy="110" r="28" />
      <circle cx="230" cy="110" r="12" />
    </g>
    <!-- Small Gear -->
    <g class="gear-spin-small">
      <circle cx="90" cy="110" r="30" stroke-dasharray="5,4" stroke-width="5" />
      <circle cx="90" cy="110" r="20" />
      <circle cx="90" cy="110" r="8" />
    </g>
  </g>

  <!-- Dynamic Waveforms / Sensor Telemetry Signal Line -->
  <g filter="url(#glow)">
    <!-- Base dim signal wave -->
    <path d="M 50 260 Q 200 260 300 240 T 500 220 T 650 250 T 800 180 T 950 240 T 1150 240" 
          fill="none" stroke="#1e293b" stroke-width="3" />
    
    <!-- Animated Telemetry Pulse Wave (Vibration/Acoustic monitoring wave) -->
    <path class="telemetry-line" 
          d="M 50 250 L 250 250 L 280 230 L 310 270 L 340 210 L 370 290 L 400 180 L 430 310 L 460 220 L 490 260 L 520 250 
             L 650 250 L 680 230 L 710 260 L 740 140 L 770 330 L 800 120 L 830 280 L 860 210 L 890 250 L 1150 250" 
          fill="none" stroke="url(#signalGradient)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Anomaly Detection Pulse Nodes -->
  <g filter="url(#subtleGlow)">
    <!-- Anomaly Alert Node 1 -->
    <circle cx="430" cy="310" r="6" fill="#ef4444" class="pulse-node" />
    <circle cx="430" cy="310" r="12" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.6" class="pulse-node" />
    <text x="430" y="340" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Vibration Spike</text>

    <!-- Normal Telemetry Node 2 -->
    <circle cx="740" cy="140" r="5" fill="#3b82f6" class="pulse-node" />
    <text x="740" y="120" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">FFT Acoustic Peak</text>

    <!-- Failure Prediction Node 3 -->
    <circle cx="800" cy="120" r="6" fill="#f59e0b" class="pulse-node" />
    <circle cx="800" cy="120" r="14" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.6" class="pulse-node" />
    <text x="800" y="98" fill="#fde047" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">RUL Prediction: 84%</text>
  </g>

  <!-- Main Header Content -->
  <g transform="translate(320, 75)">
    <!-- Main Title -->
    <text x="280" y="55" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="900" font-size="42" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">
      Awesome Predictive Maintenance
    </text>

    <!-- Subtitle / Tagline -->
    <text x="280" y="95" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="700" font-size="24" fill="url(#primaryGlow)" text-anchor="middle" letter-spacing="0.5">
      Industrial IoT &amp; Asset Health Intelligence Platform
    </text>

    <text x="280" y="125" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="400" font-size="14" fill="#94a3b8" text-anchor="middle">
      Enterprise PdM SaaS • Machine Learning Anomaly Detection • Acoustic &amp; Vibration Telemetry
    </text>

    <!-- Feature Badges -->
    <g transform="translate(45, 150)">
      <!-- Badge 1: IIoT Telemetry -->
      <g class="floating-badge" transform="translate(0, 0)">
        <rect x="0" y="0" width="130" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
        <text x="65" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#60a5fa" text-anchor="middle">📡 IIoT Sensors</text>
      </g>

      <!-- Badge 2: RUL Estimation -->
      <g class="floating-badge" transform="translate(145, 0)" style="animation-delay: 1s;">
        <rect x="0" y="0" width="145" height="30" rx="15" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
        <text x="72.5" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#c084fc" text-anchor="middle">🧠 RUL &amp; ML Models</text>
      </g>

      <!-- Badge 3: Condition Monitoring -->
      <g class="floating-badge" transform="translate(305, 0)" style="animation-delay: 2s;">
        <rect x="0" y="0" width="165" height="30" rx="15" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
        <text x="82.5" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">⚡ Zero Downtime AI</text>
      </g>
    </g>
  </g>

  <!-- Decorative Top Right Grid Accents -->
  <g transform="translate(1080, 20)" fill="none" stroke="#334155" stroke-width="1">
    <path d="M 0 0 L 100 0 L 100 100" />
    <circle cx="100" cy="0" r="4" fill="#3b82f6" />
    <circle cx="80" cy="0" r="2" fill="#8b5cf6" />
    <circle cx="100" cy="20" r="2" fill="#8b5cf6" />
  </g>

  <!-- Decorative Bottom Left Grid Accents -->
  <g transform="translate(20, 340)" fill="none" stroke="#334155" stroke-width="1">
    <path d="M 0 0 L 0 -80 L 80 -80" />
    <circle cx="0" cy="0" r="4" fill="#10b981" />
  </g>
</svg>
